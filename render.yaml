# Render.com deployment — uses Docker (no "start command" field needed, CMD in Dockerfile handles it)
# Deploy: dashboard.render.com → New → Blueprint → connect your GitHub repo

services:
  # ── Web Dashboard ────────────────────────────────────────────────────────────
  # Render detects Dockerfile automatically. No start command needed.
  # Free tier: 750 hrs/month. Spins down after 15min inactivity (wake on next visit).
  # NOTE: Free tier has NO persistent disk. DB lives in /tmp — resets on redeploy.
  #       Use GitHub Actions (below) as the source of truth for pipeline data.
  - type: web
    name: b2b-lead-gen-dashboard
    env: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false           # Set manually in Render dashboard → Environment
      - key: SENDER_EMAIL
        sync: false
      - key: SENDER_NAME
        sync: false
      - key: EMAIL_PROVIDER
        value: gmail
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: BREVO_SMTP_USER
        sync: false
      - key: BREVO_SMTP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: DAILY_TARGET
        value: "10"
      - key: MIN_FIT_SCORE
        value: "60"
      - key: DATABASE_PATH
        value: /tmp/leads.db   # /tmp works on free tier; no persistent disk on free plan
      - key: DASHBOARD_SECRET_KEY
        generateValue: true
